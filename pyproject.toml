[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "notewrench"
version = "0.1.0"
description = "Offline tools for personal knowledge bases: move Zotero, Joplin and Wallabag data into Logseq, archive read-later articles as HTML/EPUB, find duplicates, audit attachments and citekeys, merge Anki course updates."
# README.md with repository-relative links rewritten for PyPI (see tool.hatch.metadata.hooks below).
dynamic = ["readme"]
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/*"]
authors = [{ name = "tianhaogutum" }]
keywords = [
    "pkm", "personal-knowledge-management", "note-taking", "zotero", "joplin", "logseq",
    "calibre", "wallabag", "karakeep", "read-later", "bibtex", "csl-json", "pandoc",
    "citekeys", "epub", "deduplication", "migration", "offline",
    "anki", "linkding", "bookmarks", "biblatex", "web-archive",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Office/Business",
    "Topic :: System :: Archiving",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
# The core commands use only the Python standard library; anki-merge, relink,
# browser-bookmarks, zotero-dupes and bibtex-keys need the optional extra of the same
# name (`pip install 'notewrench[<command>]'`). POSIX only: Windows is not
# supported (zotero-logseq locks the graph with fcntl; several commands rely on
# descriptor-relative, no-follow file access). `archive` publication/verification and
# `zotero-attachments` audits additionally need Linux.
dependencies = []

[project.optional-dependencies]
# One extra per command that wraps third-party libraries; the dispatcher prints the
# install hint when one is missing. The other commands need nothing beyond Python.
anki-merge = ["csvdiff>=0.3.3,<0.4"]
relink = [
    "beautifulsoup4>=4.12,<5",
    "idna>=3.7,<4",
    "markdown-it-py>=4.0,<5",
    "mdit-py-plugins>=0.5,<1",
    "warcio>=1.7.5,<2",
]
browser-bookmarks = [
    "beautifulsoup4>=4.13,<5",
    "html5lib>=1.1,<2",
    "webencodings>=0.5.1,<1",
    "filelock>=3.20,<4",
    "ijson>=3.3,<4",
]
# Heavy: BibDedupe brings pandas and NumPy.
zotero-dupes = [
    "bib-dedupe>=0.11.0,<0.12",
    "rdflib>=7.6,<8",
    "defusedxml>=0.7.1,<1",
    "rapidfuzz>=3.10,<4",
    "pandas>=2.2.3,<3",  # BibDedupe 0.11 fails on sparse records under pandas 3
    "isbnlib>=3.10.14,<4",
    "jsonschema>=4.26,<5",
]
bibtex-keys = [
    "pybtex>=0.26.1,<0.27",
    "markdown-it-py>=4.3.0,<5",
    "mdit-py-plugins>=0.7.0,<0.8",
    "pylatexenc>=2.11,<3",
    "PyYAML>=6.0.3,<7",
]
# Test runner plus every optional extra, so the full suite runs. Suites whose extra
# is missing are skipped by tests/conftest.py. (The anki-merge integration tests also
# use the headless `anki` package when it is installed; it is not listed here.)
test = [
    "pytest>=9.0.2",
    "hypothesis>=6,<7",
    "notewrench[anki-merge,relink,browser-bookmarks,zotero-dupes,bibtex-keys]",
]

[project.urls]
Homepage = "https://github.com/tianhaogutum/notewrench"
Repository = "https://github.com/tianhaogutum/notewrench"
Issues = "https://github.com/tianhaogutum/notewrench/issues"
Documentation = "https://github.com/tianhaogutum/notewrench/blob/main/docs/README.md"

[project.scripts]
notewrench = "notewrench.cli:main"

# PyPI cannot resolve repository-relative links or images: rewrite them to GitHub URLs.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# <img src>, <source srcset>: raw file URLs so the images render
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/tianhaogutum/notewrench/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/tianhaogutum/notewrench/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Markdown images, then Markdown links to files and directories
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/tianhaogutum/notewrench/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/notewrench/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# In-page anchors: PyPI does not generate heading ids
pattern = '\]\(#([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/notewrench#\1)'

[tool.hatch.build.targets.wheel]
# Every file under src/notewrench ships in the wheel, including the generated
# linkdedupe/_idna_data.py table (its notices are in THIRD_PARTY.md and licenses/).
packages = ["src/notewrench"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/benchmarks",
    "/licenses",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY.md",
    "/pyproject.toml",
]
exclude = [
    "__pycache__",
    "*.py[cod]",
    ".cache",
    ".demo",
    ".pytest_cache",
    ".ruff_cache",
    ".DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused set; the merged tools keep their original compact style.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules re-export fixtures and helpers across sibling modules and keep a compact style.
"tests/**" = ["F401", "F811", "F841", "E402", "E701", "E702", "E731"]
# Demo and benchmark scripts keep the original tools' compact one-line style.
"examples/**" = ["F841", "E701", "E702", "E402"]
"benchmarks/**" = ["F841", "E701", "E702", "E402"]
