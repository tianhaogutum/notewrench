<svg xmlns="http://www.w3.org/2000/svg" width="976" height="789" viewBox="0 0 976 789" role="img" aria-labelledby="t d">
<title id="t">notewrench doctor on the bundled synthetic exports</title>
<desc id="d">Terminal output of notewrench doctor examples/doctor: one verdict per source (a Zotero library with a missing attachment, a duplicate file and an orphan folder; a Joplin export with a duplicate note; a Calibre library with duplicate books; Karakeep and Wallabag exports with a duplicate bookmark; Markdown notes with unknown and renamed citekeys), then the top fixes with the exact notewrench commands. Generated by assets/render_terminal.py.</desc>
<style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;font-size:13px;fill:#d9dde3;white-space:pre}.b{font-weight:700;fill:#ffffff}.d{fill:#8a919c}.c31{fill:#ff7b72}.c32{fill:#7ee787}.c33{fill:#e3b341}.c34{fill:#79c0ff}.c35{fill:#d2a8ff}.c36{fill:#76d4e8}.title{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;fill:#8a919c}</style>
<rect x="0.5" y="0.5" width="975" height="788" rx="10" fill="#14171c" stroke="#3a404a"/>
<path d="M0.5 32 V10.5 a10 10 0 0 1 10 -10 H965.5 a10 10 0 0 1 10 10 V32 Z" fill="#1d2128"/>
<line x1="0.5" y1="32" x2="975.5" y2="32" stroke="#3a404a"/>
<circle cx="20" cy="16.0" r="5.5" fill="#ff5f57"/>
<circle cx="38" cy="16.0" r="5.5" fill="#febc2e"/>
<circle cx="56" cy="16.0" r="5.5" fill="#28c840"/>
<text class="title" x="488.0" y="20.0" text-anchor="middle">examples/doctor  —  synthetic Zotero, Joplin, Calibre, Karakeep/Wallabag and citation files, offline</text>
<text y="59" xml:space="preserve"><tspan x="18.0" class="b c32">$</tspan><tspan x="33.7" class="b">notewrench doctor examples/doctor</tspan></text>
<text y="76" xml:space="preserve"><tspan x="18.0" class="b">notewrench doctor</tspan><tspan x="166.8" class="d">5 checks · read-only, nothing is written</tspan></text>
<text y="110" xml:space="preserve"><tspan x="33.7" class="c31">✗</tspan><tspan x="49.3" class="b">Zotero</tspan><tspan x="143.3">7 attachments: 1 missing file, 1 duplicate set (11 B extra), 1 orphan folder (22 B)</tspan></text>
<text y="127" xml:space="preserve"><tspan x="143.3" class="d">examples/doctor/zotero</tspan></text>
<text y="144" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3" class="b">Joplin</tspan><tspan x="143.3">3 notes: 1 exact-duplicate group (1 extra copy)</tspan></text>
<text y="161" xml:space="preserve"><tspan x="143.3" class="d">examples/doctor/joplin-export.jex</tspan></text>
<text y="178" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3" class="b">Calibre</tspan><tspan x="143.3">7 books: 1 strong duplicate cluster, 1 possible duplicate, 1 invalid ISBN, 1 book without authors</tspan></text>
<text y="195" xml:space="preserve"><tspan x="143.3" class="d">examples/doctor/calibre</tspan></text>
<text y="212" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3" class="b">Read-later</tspan><tspan x="143.3">4 bookmarks in Karakeep + Wallabag: 1 duplicate cluster (2 bookmarks, 1 across exports)</tspan></text>
<text y="229" xml:space="preserve"><tspan x="143.3" class="d">examples/doctor/read-later/karakeep.json, examples/doctor/read-later/wallabag.json</tspan></text>
<text y="246" xml:space="preserve"><tspan x="33.7" class="c31">✗</tspan><tspan x="49.3" class="b">Citations</tspan><tspan x="143.3">2 Markdown files: 1 unknown-key citation, 7 renamed-key citations, 2 unsupported citations</tspan></text>
<text y="263" xml:space="preserve"><tspan x="143.3" class="d">examples/doctor/thesis/references-old.json, examples/doctor/thesis/references.json + 2 Markdown files</tspan></text>
<text y="297" xml:space="preserve"><tspan x="18.0" class="b">Top fixes</tspan></text>
<text y="314" xml:space="preserve"><tspan x="33.7">1. Restore 1 missing Zotero attachment and review 2 cleanup candidates</tspan></text>
<text y="331" xml:space="preserve"><tspan x="57.1" class="d">Missing: STUVWXYZ/missing.pdf. Restore the file or re-link it in Zotero. Duplicate sets and orphan folders are</tspan></text>
<text y="348" xml:space="preserve"><tspan x="88.5" class="d">candidates only; keep trashed items.</tspan></text>
<text y="365" xml:space="preserve"><tspan x="57.1" class="c36">notewrench zotero-attachments --snapshot examples/doctor/zotero/zotero.sqlite --storage</tspan></text>
<text y="382" xml:space="preserve"><tspan x="88.5" class="c36">examples/doctor/zotero/storage --format markdown &gt; zotero-audit.md</tspan></text>
<text y="399" xml:space="preserve"><tspan x="33.7">2. Fix 1 citation whose key is in no bibliography</tspan></text>
<text y="416" xml:space="preserve"><tspan x="57.1" class="d">examples/doctor/thesis/reading-notes.md:3 @notInExport. Add the item to your library and export again, or correct</tspan></text>
<text y="433" xml:space="preserve"><tspan x="88.5" class="d">the key.</tspan></text>
<text y="450" xml:space="preserve"><tspan x="33.7">3. Rekey 7 citations in 2 files from references-old.json to references.json</tspan></text>
<text y="467" xml:space="preserve"><tspan x="57.1" class="d">Same items (matched by DOI or URL) under new keys: chainA -&gt; chainB, chainB -&gt; chainC, doe2020 -&gt; Doe20 and 1 more.</tspan></text>
<text y="484" xml:space="preserve"><tspan x="88.5" class="d">If references.json is your current export, preview the rewrite, then rerun with --out-dir rekeyed to write</tspan></text>
<text y="501" xml:space="preserve"><tspan x="88.5" class="d">copies.</tspan></text>
<text y="518" xml:space="preserve"><tspan x="57.1" class="c36">notewrench citekeys --old examples/doctor/thesis/references-old.json --new examples/doctor/thesis/references.json</tspan></text>
<text y="535" xml:space="preserve"><tspan x="88.5" class="c36">--root examples/doctor/thesis chapter-1.md reading-notes.md --dry-run</tspan></text>
<text y="552" xml:space="preserve"><tspan x="33.7">4. Review 2 Calibre duplicate clusters (4 books)</tspan></text>
<text y="569" xml:space="preserve"><tspan x="57.1" class="d">Pick a keeper per cluster in the plan's decisionTemplate, check it with --decisions, then merge in Calibre itself.</tspan></text>
<text y="586" xml:space="preserve"><tspan x="88.5" class="d">calibre-dupes never writes the library.</tspan></text>
<text y="603" xml:space="preserve"><tspan x="57.1" class="c36">notewrench calibre-dupes examples/doctor/calibre -o calibre-review.json</tspan></text>
<text y="620" xml:space="preserve"><tspan x="33.7">5. Review 1 Joplin duplicate group</tspan></text>
<text y="637" xml:space="preserve"><tspan x="57.1" class="d">Approve groups and pick a keeper in joplin-decisions.json, then add --apply-decisions joplin-decisions.json</tspan></text>
<text y="654" xml:space="preserve"><tspan x="88.5" class="d">--output-dir joplin-deduplicated to write a new JEX to import. Your exports are never changed.</tspan></text>
<text y="671" xml:space="preserve"><tspan x="57.1" class="c36">notewrench joplin-dupes examples/doctor/joplin-export.jex --format markdown -o joplin-review.md</tspan></text>
<text y="688" xml:space="preserve"><tspan x="57.1" class="c36">notewrench joplin-dupes examples/doctor/joplin-export.jex --decision-template joplin-decisions.json &gt;</tspan></text>
<text y="705" xml:space="preserve"><tspan x="88.5" class="c36">joplin-review.json</tspan></text>
<text y="722" xml:space="preserve"><tspan x="33.7" class="d">... 1 more (--fixes N, or --format json)</tspan></text>
<text y="756" xml:space="preserve"><tspan x="18.0" class="c31">19 findings</tspan><tspan x="112.0">in 5 of 5 checks: 2 errors, 12 warnings, 5 notes.</tspan></text>
<text y="773" xml:space="preserve"><tspan x="18.0">--fail-on error:</tspan><tspan x="151.1" class="c31">FAIL (exit 1)</tspan></text>
</svg>
